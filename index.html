<style>
/* Layout: full-bleed 3D stage; a control rail (left on desktop, bottom sheet on phones) and a selection card.
   Signage language of a station: condensed caps for storey/track names, mono for heights and times. */
:root {
  --bg: #e8ecf0;            /* stage background */
  --panel: #fbfcfd;
  --panel-2: #eef1f4;
  --fg: #16202a;
  --muted: #5b6875;
  --line: #cfd6dd;
  --accent: #c8102e;        /* station red: focus, selection */
  --accent-fg: #ffffff;
  --floor: #c9d0d8;
  --floor-edge: #7d8a97;
  --hall: #d8dde3;
  --rail: #8d97a1;
  --g-318: #2563c9;
  --g-2122: #d4860b;
  --g-3134: #0d9b6c;
  --g-4144: #8b4fd6;
  --c-stairs: #e7b416;
  --c-escalator: #e0412f;
  --c-lift: #0aa0b8;
  --c-ramp: #8a99a8;
  --route: #e8338a;
  --route-sf: #2f9e0f;
  --closed: #b3261e;
  --shop: #8a5a2b;          /* shop outlines (solid = mapped, dashed = schematic) */
  --shop-wall: #7d8590;     /* OSM indoor walls shown with the shops */
  --wing: #a9b2bc;          /* Nordtrakt / Südtrakt: building wings that hold the shops */
  --divider: #3f4954;       /* building:part outlines that divide the station building */
  --tram: #1d6fa5;          /* tram platforms at street level (VBZ blue) */
  --route-conn: #1b2430;    /* stairs / escalators / lifts on the current route: dark ink, stands out from the route line */
  --street: #9aa5b1;        /* street-level paths */
  --shadow: 0 1px 2px rgb(16 24 32 / .08), 0 8px 24px rgb(16 24 32 / .10);
  --f-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --panel: #1a2129; --panel-2: #232c36; --fg: #e8edf2; --muted: #9aa7b4; --line: #313c48;
    --accent: #ff4d5e; --accent-fg: #ffffff; --floor: #3a4552; --floor-edge: #8796a6; --hall: #2f3843; --rail: #5f6c79;
    --g-318: #4d8df0; --g-2122: #f0a12c; --g-3134: #26c08a; --g-4144: #a77bf0;
    --c-stairs: #f2c93a; --c-escalator: #ff5a47; --c-lift: #27c6dd; --c-ramp: #9fb0c0;
    --route: #ff5ca8; --route-sf: #7ad83a; --closed: #ff6b5e; --shop: #d9a066; --shop-wall: #6b7684; --wing: #1c232b; --divider: #b7c1cc; --tram: #4aa3df; --street: #55606c; --route-conn: #f2f4f7;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --panel: #1a2129; --panel-2: #232c36; --fg: #e8edf2; --muted: #9aa7b4; --line: #313c48;
  --accent: #ff4d5e; --accent-fg: #ffffff; --floor: #3a4552; --floor-edge: #8796a6; --hall: #2f3843; --rail: #5f6c79;
  --g-318: #4d8df0; --g-2122: #f0a12c; --g-3134: #26c08a; --g-4144: #a77bf0;
  --c-stairs: #f2c93a; --c-escalator: #ff5a47; --c-lift: #27c6dd; --c-ramp: #9fb0c0;
  --route: #ff5ca8; --route-sf: #7ad83a; --closed: #ff6b5e; --shop: #d9a066; --shop-wall: #6b7684; --wing: #1c232b; --divider: #b7c1cc; --tram: #4aa3df; --street: #55606c; --route-conn: #f2f4f7;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; }
#labels { position: fixed; inset: 0; pointer-events: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- control rail ---------- */
.rail {
  position: fixed; z-index: 5; top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: 300px; max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
}
.rail-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.mark { width: 26px; height: 26px; flex: none; border-radius: 4px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font: 700 13px/1 var(--f-display); letter-spacing: .02em; }
.rail-head h1 { margin: 0; font: 700 20px/1.05 var(--f-display); letter-spacing: .01em; text-wrap: balance; }
.rail-head p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }
.sheet-toggle { display: none; margin-left: auto; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 4px 10px; font: 600 13px var(--f-display); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; }
.rail-body { overflow-y: auto; padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 16px; }
.sec h2 { margin: 12px 0 8px; font: 600 12px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

.storeys { display: flex; flex-direction: column; gap: 4px; }
.storey { display: grid; grid-template-columns: 34px 1fr auto auto; align-items: center; gap: 8px; padding: 6px 6px 6px 4px; border-radius: 7px; border: 1px solid transparent; background: none; text-align: left; cursor: pointer; }
.storey:hover { background: var(--panel-2); }
.storey[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); }
.storey .sid { font: 700 15px/1 var(--f-display); text-align: center; padding: 4px 0; border-radius: 4px; background: var(--fg); color: var(--bg); }
.storey .sname { font-size: 13px; line-height: 1.2; min-width: 0; }
.storey .sname small { display: block; color: var(--muted); font-size: 11.5px; }
.storey .sz { font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.storey .top { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 2px 6px; font: 600 11px var(--f-display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.storey .top:hover { border-color: var(--fg); }
.dots { display: inline-flex; gap: 3px; margin-left: 4px; vertical-align: 1px; }
.dots i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }

.slider-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 13px; }
.slider-row output { font: 500 12px var(--f-mono); color: var(--muted); }
input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0; }

.views { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.views button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 8px 4px; font: 600 13px/1.1 var(--f-display); letter-spacing: .03em; cursor: pointer; }
.views button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; font-size: 13px; }
.legend div { display: flex; align-items: center; gap: 8px; min-width: 0; }
.legend svg { flex: none; }
.legend .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; }
.legend .closed-sw { background: repeating-linear-gradient(45deg, var(--closed) 0 3px, transparent 3px 6px); border: 1px solid var(--closed); }
.fine { font-size: 11.5px; color: var(--muted); line-height: 1.4; }

/* ---------- selection card ---------- */
.card {
  position: fixed; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px));
  width: 360px; max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px 16px;
}
.card .eyebrow { font: 600 11.5px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.card h3 { margin: 2px 0 6px; font: 700 26px/1.05 var(--f-display); text-wrap: balance; }
.card p { margin: 6px 0; }
.card .close { float: right; border: 1px solid var(--line); background: var(--panel-2); width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 16px; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 4px 10px; font: 600 13px var(--f-display); letter-spacing: .02em; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip i { width: 9px; height: 9px; border-radius: 2px; }
.pill { display: inline-block; border-radius: 4px; padding: 1px 6px; font: 600 12px var(--f-display); letter-spacing: .04em; }
.pill.ok { background: color-mix(in srgb, var(--route-sf) 18%, transparent); color: var(--route-sf); }
.pill.lift { background: color-mix(in srgb, var(--c-lift) 18%, transparent); color: var(--c-lift); }
.pill.closed { background: color-mix(in srgb, var(--closed) 16%, transparent); color: var(--closed); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; margin: 8px 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.routes { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.routes li { display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 10px; align-items: start; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); }
.routes .ln { width: 14px; height: 4px; border-radius: 2px; margin-top: 8px; }
.routes .ln.dash { background: repeating-linear-gradient(90deg, var(--route-sf) 0 5px, transparent 5px 8px) !important; }
.routes b { font: 600 14px/1.25 var(--f-display); letter-spacing: .01em; }
.routes .t { font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.routes .via { grid-column: 2 / -1; font-size: 12.5px; color: var(--muted); }
.access { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; margin: 6px 0; }
.access span { display: inline-flex; align-items: center; gap: 6px; }
.banner { margin: 8px 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--closed); color: var(--closed); font-size: 13.5px; background: color-mix(in srgb, var(--closed) 8%, transparent); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; font: 600 16px var(--f-display); letter-spacing: .06em; color: var(--muted); }
.error { max-width: 46ch; padding: 16px; text-align: left; font: 400 14px var(--f-body); color: var(--fg); }

/* ---------- labels in the 3D scene ---------- */
.lb { pointer-events: none; white-space: nowrap; transform: translateY(-2px); }
.lb-track { pointer-events: auto; cursor: pointer; display: inline-flex; gap: 2px; padding: 2px; border-radius: 5px; background: var(--fg); box-shadow: 0 1px 3px rgb(0 0 0 / .25); }
.lb-track span { min-width: 20px; padding: 1px 4px; text-align: center; border-radius: 3px; color: #fff; font: 700 14px/1.15 var(--f-display); }
.lb-area { font: 600 12px var(--f-display); letter-spacing: .03em; color: var(--fg); text-shadow: 0 0 3px var(--bg), 0 0 6px var(--bg); }
.lb-storey { font: 700 13px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-shadow: 0 0 4px var(--bg); }
.lb-storey b { color: var(--fg); margin-right: 6px; }
.lb-track .closed-tag { font: 700 11px/1.15 var(--f-display); font-style: normal; letter-spacing: .04em; text-transform: uppercase; color: #fff; background: var(--closed); padding: 2px 6px; border-radius: 3px; align-self: center; }
.lb-shop { font: 500 11px var(--f-body); color: var(--fg); text-shadow: 0 0 2px var(--bg), 0 0 4px var(--bg), 0 0 6px var(--bg); }
.variant { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: var(--shop); color: #fff; font: 700 11px/1.4 var(--f-display); letter-spacing: .08em; text-transform: uppercase; vertical-align: 2px; }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 10px; cursor: pointer; }
.check-row input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
/* ---------- route search ---------- */
.route-form { display: grid; grid-template-columns: 1fr 38px; gap: 6px 8px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 3px; position: relative; min-width: 0; }
.field label { font: 600 11.5px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.field label b { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; color: #fff; font: 700 10.5px/1 var(--f-display); letter-spacing: 0; }
.field input { font: 15px/1.2 var(--f-body); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 8px 28px 8px 10px; width: 100%; box-sizing: border-box; min-width: 0; }
.field input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.field .clr { position: absolute; right: 4px; bottom: 5px; width: 24px; height: 24px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; }
.swap { grid-column: 2; grid-row: 1 / span 2; align-self: center; width: 38px; height: 38px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; cursor: pointer; font-size: 17px; }
.sugg { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin-top: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); max-height: 280px; overflow-y: auto; }
.sugg button { display: grid; grid-template-columns: 26px 1fr; gap: 0 8px; align-items: center; width: 100%; text-align: left; padding: 7px 10px; border: 0; background: none; cursor: pointer; font-size: 14px; }
.sugg button[aria-selected="true"], .sugg button:hover { background: var(--panel-2); }
.sugg .k { width: 24px; height: 20px; border-radius: 4px; display: grid; place-items: center; font: 700 11px/1 var(--f-display); color: #fff; background: var(--fg); }
.sugg small { grid-column: 2; color: var(--muted); font-size: 11.5px; }
.sugg .none { padding: 8px 10px; color: var(--muted); font-size: 13px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 10px; }
.seg button { border: 0; border-left: 1px solid var(--line); background: var(--panel-2); padding: 8px 4px; font: 600 13px/1.1 var(--f-display); letter-spacing: .02em; cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.btn-row { display: flex; gap: 6px; margin-top: 8px; }
.btn-row button { flex: 1; border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 7px 6px; font: 600 13px var(--f-display); letter-spacing: .03em; cursor: pointer; }
.btn-row button:disabled { opacity: .45; cursor: default; }
.rsum { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 0 2px; }
.rsum .big { font: 700 28px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.rsum .muted { font-size: 13.5px; }
.steps { list-style: none; margin: 10px 0 0; padding: 0; }
.steps li { display: grid; grid-template-columns: 24px 1fr auto; gap: 1px 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.3; }
.steps li .ic { display: grid; place-items: center; height: 20px; }
.steps li .m { font: 500 12.5px var(--f-mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.steps li small { grid-column: 2 / -1; color: var(--muted); font-size: 12px; }
.steps .pinb { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 11px/1 var(--f-display); }
.lb-pin { pointer-events: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; font: 700 13px/1 var(--f-display); border: 2px solid #fff; box-shadow: 0 1px 4px rgb(0 0 0 / .35); }
.warn { margin: 8px 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--closed); color: var(--closed); font-size: 13.5px; background: color-mix(in srgb, var(--closed) 8%, transparent); }
.lb-tram { pointer-events: auto; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px 2px 2px; border-radius: 5px; background: var(--panel); border: 1px solid var(--tram); box-shadow: 0 1px 3px rgb(0 0 0 / .2); font: 600 12px/1.2 var(--f-display); color: var(--fg); }
.lb-tram .t { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 3px; background: var(--tram); color: #fff; font: 700 11px/1 var(--f-display); }
.lb-tram .ln { color: var(--muted); font-weight: 500; }
.lb-tram.closed { border-color: var(--closed); }
.lb-tram.closed .t { background: var(--closed); }
.lb-closed { font: 700 11.5px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--closed); padding: 2px 6px; border-radius: 3px; }

/* ================= mobile version (iPhone first) =================
   A bottom sheet holds the route search, the result and the step-by-step guide; a top bar holds Fit / Overview / More.
   Everything else of the desktop rail (storeys, view, layers, legend) sits behind "More". */
:root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --kb: 0px; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
html, body { overscroll-behavior: none; }
body { position: fixed; inset: 0; -webkit-tap-highlight-color: transparent; font-size: 16px; }
.lb-area { font-size: 11px; }
.lb-track span { font-size: 12.5px; min-width: 17px; }
.lb-pin { width: 28px; height: 28px; font-size: 14px; }

/* top bar */
.topbar { position: fixed; z-index: 7; top: calc(8px + var(--sat)); left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 0 12px 0 8px; box-shadow: var(--shadow); font: 700 17px/1 var(--f-display); letter-spacing: .01em; white-space: nowrap; }
.storey-chip { position: fixed; z-index: 7; top: calc(60px + var(--sat)); left: max(10px, env(safe-area-inset-left, 0px)); max-width: calc(100% - 20px); height: 34px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
  box-shadow: var(--shadow); font: 600 14px/1 var(--f-display); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.storey-chip b { background: var(--fg); color: var(--bg); border-radius: 4px; padding: 3px 5px; font-size: 13px; }
.topbar .spacer { flex: 1; }
.fab { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); box-shadow: var(--shadow);
  display: grid; place-items: center; cursor: pointer; padding: 0; }
.fab svg { width: 22px; height: 22px; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

// ------------------------------------------------------------------ data loading
async function loadScene() {
  if (location.protocol !== 'file:') try {
    const r = await fetch('data/hb_scene.json');
    if (r.ok) return await r.json();
  } catch (e) { /* file:// or offline: fall back to the script copy */ }
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'data/hb_scene.js'; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  return window.HB_SCENE;
}

async function loadShops() {
  if (location.protocol !== 'file:') try {
    const r = await fetch('data/hb_shops.json');
    if (r.ok) return await r.json();
  } catch (e) { /* fall back to the script copy */ }
  try {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'data/hb_shops.js'; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    return window.HB_SHOPS;
  } catch (e) { return null; }     // the viewer still works without shops
}

async function loadNav() {
  if (location.protocol !== 'file:') try {
    const r = await fetch('data/hb_nav.json');
    if (r.ok) return await r.json();
  } catch (e) { /* fall back to the script copy */ }
  try {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'data/hb_nav.js'; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    return window.HB_NAV;
  } catch (e) { return null; }     // without it the route search is switched off
}

let D, SH, NAV;
try { [D, SH, NAV] = await Promise.all([loadScene(), loadShops(), loadNav()]); }
catch (e) {
  document.getElementById('loading').innerHTML = '<div class="error"><b>The station data did not load.</b><br>Run <span class="mono">python3 _scripts/build_viewer_data.py</span> so that <span class="mono">app/data/hb_scene.js</span> exists, then reload this page.</div>';
  throw e;
}

// ------------------------------------------------------------------ constants & helpers
const VEX = 2.5;                // vertical exaggeration (station is 600 m long but only 16 m deep)
const GAP = 34;                 // extra metres between storeys at 100 % explode
const REF = D.meta.ref_z;
const TYPES = D.meta.types;     // walkway, stairs, escalator, lift, ramp
const T = Object.fromEntries(TYPES.map((t, i) => [t, i]));
const GROUPS = {
  'HB_ground_3-18': { label: '3–18', name: 'Gleise 3–18', token: '--g-318' },
  'SZU_21-22': { label: '21–22', name: 'SZU, Gleise 21–22', token: '--g-2122' },
  'Loewenstrasse_31-34': { label: '31–34', name: 'Löwenstrasse, Gleise 31–34', token: '--g-3134' },
  'Museumstrasse_41-44': { label: '41–44', name: 'Museumstrasse, Gleise 41–44', token: '--g-4144' },
};
const STOREY_SHORT = { E0: 'Erdgeschoss', Z1: 'Upper passages', Z2: 'Lower passages', U1: 'SZU station', U2: 'Deep platforms' };
const STOREY_SUB = {
  E0: 'Querhalle, Haupthalle, tracks 3–18', Z1: 'ShopVille Bahnhofplatz, Passage Sihlquai', Z2: 'Passages, Halle Landesmuseum',
  U1: 'Tracks 21–22 (closed)', U2: 'Tracks 31–34 and 41–44',
};
const zoneById = Object.fromEntries(D.zones.map(z => [z.id, z]));
const storeyById = Object.fromEntries(D.storeys.map(s => [s.id, s]));
const zoneOrder = D.zones.map(z => storeyById[z.storey].order);      // by zone index
const zoneStorey = D.zones.map(z => z.storey);
const zoneIdx = Object.fromEntries(D.zones.map((z, i) => [z.id, i]));
const N = D.nodes;              // [x, y, z, zoneIdx, kindIdx]
const E = D.edges;              // [from, to, type, length, time, flags]
// closures from hb_closures.json that are in force today (date-based; the SZU station reopens on 13.12.2026)
const TODAY = new Date().toISOString().slice(0, 10);
const isoDate = (v) => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
// last day of a closure: an ISO date, or "YYYY-MM (mid-…)" = the 15th, or "YYYY-MM …" = the last day of that month
function closureEnd(c) {
  if (isoDate(c.until)) return c.until;
  const m = /^(\d{4})-(\d{2})/.exec(c.until || '');
  if (!m) return null;
  if (/mid/i.test(c.until)) return `${m[1]}-${m[2]}-15`;
  const last = new Date(Date.UTC(+m[1], +m[2], 0)).getUTCDate();
  return `${m[1]}-${m[2]}-${String(last).padStart(2, '0')}`;
}
const fmtDay = (iso) => iso.split('-').reverse().join('.');
const ACTIVE_CLOSURES = (D.closures || []).filter(c => { const end = closureEnd(c); return end && TODAY <= end && (!isoDate(c.from) || TODAY >= c.from); });
const CLOSED_EDGE_SET = new Set();
for (const c of ACTIVE_CLOSURES) for (const k of ((NAV && NAV.closure_edges && NAV.closure_edges[c.id]) || [])) CLOSED_EDGE_SET.add(k);
if (!NAV || !NAV.closure_edges) E.forEach((e, k) => { if (e[5] & 2 && ACTIVE_CLOSURES.length) CLOSED_EDGE_SET.add(k); });
const CLOSED_EDGES_ACTIVE = CLOSED_EDGE_SET.size > 0;
const css = () => getComputedStyle(document.documentElement);
const col = (name) => new THREE.Color(css().getPropertyValue(name).trim() || '#888');
const fmtTime = (s) => { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// scene centre
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
for (const a of D.areas) for (const poly of a.polys) for (const r of poly) for (let i = 0; i < r.length; i += 2) {
  minX = Math.min(minX, r[i]); maxX = Math.max(maxX, r[i]); minY = Math.min(minY, r[i + 1]); maxY = Math.max(maxY, r[i + 1]);
}
const CX = (minX + maxX) / 2, CY = (minY + maxY) / 2;
const SPAN = Math.max(maxX - minX, maxY - minY);
const W = (x, y) => [x - CX, -(y - CY)];       // plan -> world X, Z

const nav = { from: null, to: null, profile: 'standard', route: null, fadeOthers: false, routeStoreys: new Set(), message: null };
const state = { shops: true, explode: 0.4, focus: null, view: 'overview', topStorey: 'E0', cut: 0.55, sel: null, tracks: null };
const storeyOffset = (order) => -order * state.explode * GAP;
const yOfZone = (z, zi) => (z - REF) * VEX + storeyOffset(zoneOrder[zi]);
const nodeWorld = (i) => { const n = N[i]; const [x, z] = W(n[0], n[1]); return new THREE.Vector3(x, yOfZone(n[2], n[3]) + 0.15, z); };

// ------------------------------------------------------------------ renderer, cameras, controls
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.localClippingEnabled = false;
stage.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });
// mobile: draw only when something changed (camera moves, a flight, a recolour, an escalator on the route) to save battery
let needsRender = true, renderUntil = 0;
function invalidate(ms = 0) { needsRender = true; if (ms) renderUntil = Math.max(renderUntil, performance.now() + ms); }
// iOS can drop the WebGL context (e.g. after a long time in the background): offer a reload; the route is kept in the URL
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  if (document.getElementById('lost')) return;
  const d = document.createElement('div'); d.className = 'lost'; d.id = 'lost';
  d.innerHTML = '<div><b>The 3D view was paused by the phone.</b><br>Reload to continue; your route is kept.<br><button class="btn primary" onclick="location.reload()">Reload</button></div>';
  document.body.appendChild(d);
});

const scene = new THREE.Scene();

// ------------------------------------------------------------------ step-by-step guide
// The route's node sequence is cut into the same steps as the step list: [start, ...steps, arrive].

cut.addEventListener('input', () => { state.cut = cut.value / 100; applyCut(); });

const rail = document.getElementById('rail');
const moreBtn = document.getElementById('moreBtn');
function openMore() { hidePeek(); rail.hidden = false; moreBtn.setAttribute('aria-expanded', 'true'); }
function closeMore() { if (rail.hidden) return; rail.hidden = true; moreBtn.setAttribute('aria-expanded', 'false'); invalidate(); }
moreBtn.addEventListener('click', () => rail.hidden ? openMore() : closeMore());
document.getElementById('moreClose').addEventListener('click', closeMore);
document.getElementById('homeBtn').addEventListener('click', () => { hidePeek(); state.focus = null; setView('overview'); });
document.getElementById('storeyChip').addEventListener('click', () => { if (nav.step) fitStep(); else if (state.focus) { state.focus = null; syncStoreyButtons(); recolor(); } });
function syncStoreyChip() {
  const chip = document.getElementById('storeyChip');
  let ids = null;
  if (nav.step) ids = [...new Set(nav.step.nodes.map(n => ZONE_STOREY(N[n][3])))];
  else if (state.focus) ids = [state.focus];
  chip.hidden = !ids;
  if (ids) chip.innerHTML = ids.length === 1 ? `<b>${ids[0]}</b>${esc(STOREY_SHORT[ids[0]] || '')}${!nav.step ? ' ×' : ''}` : ids.map(id => `<b>${id}</b>`).join(' → ');
}

// ------------------------------------------------------------------ bottom sheet
// modes: search (form), route (summary row + result), step (one step), info (a platform / stair / lift card)
// heights: peek (about a third of the screen), half, full; never taller than its content
const sheet = document.getElementById('sheet');
const sheetBody = document.getElementById('sheetBody');
const sheetInner = document.getElementById('sheetInner');
const grab = document.getElementById('grab');
const routeSecEl = document.getElementById('routeSec');
const SNAPS = ['peek', 'half', 'full'];
let sheetMode = 'search', snap = 'half', snapBeforeTyping = null, sheetTargetH = 240;
function vv() { return window.visualViewport || { height: innerHeight, offsetTop: 0 }; }
function cssPx(name) { const d = document.createElement('div'); d.style.cssText = `position:absolute;visibility:hidden;height:var(${name})`; document.body.appendChild(d); const h = d.offsetHeight; d.remove(); return h; }
let SAT = 0;
const sideQuery = window.matchMedia('(orientation: landscape) and (max-height: 520px)');
const sideMode = () => sideQuery.matches;
sideQuery.addEventListener('change', () => { applySnap(); resize(); });
function snapHeights() {
  const H = vv().height;
  const maxH = H - SAT - 8;
  const nat = grab.offsetHeight + sheetInner.offsetHeight;
  const cap = (x) => Math.round(Math.min(nat, maxH, x));
  return { peek: cap(Math.max(170, H * 0.32)), half: cap(H * 0.56), full: cap(maxH) };
}
function applySnap(name) {
  if (name) snap = name;
  if (sideMode()) { sheet.style.height = ''; sheetTargetH = 0; updateViewOffset(); return; }
  const h = snapHeights()[snap];
  sheetTargetH = h;
  sheet.style.height = h + 'px';
  updateViewOffset();
}
function setSheetMode(mode, toSnap) {
  sheetMode = mode;
  routeSecEl.hidden = mode !== 'search';
  document.getElementById('routeSummary').hidden = mode !== 'route' || !nav.from || !nav.to;
  sheetBody.scrollTop = 0;
  applySnap(toSnap || snap);
}
function sheetTyping(on) {
  if (on) { if (!snapBeforeTyping) snapBeforeTyping = snap; sheet.classList.add('kb'); applySnap('full'); }
  else {
    sheet.classList.remove('kb');
    applySnap(snapBeforeTyping || 'half'); snapBeforeTyping = null;
    window.scrollTo(0, 0);           // iOS may leave the page scrolled after the keyboard closes
  }
}
new ResizeObserver(() => applySnap()).observe(sheetInner);
// drag the handle; a tap steps through the heights
let drag = null;
grab.addEventListener('pointerdown', (e) => {
  drag = { y: e.clientY, h: sheet.getBoundingClientRect().height, t: performance.now(), moved: false };
  grab.setPointerCapture(e.pointerId); sheet.classList.add('dragging');
});
grab.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dy = e.clientY - drag.y; if (Math.abs(dy) > 4) drag.moved = true;
  const hs = snapHeights();
  sheet.style.height = Math.max(hs.peek * 0.6, Math.min(hs.full, drag.h - dy)) + 'px';
});
function endDrag(e) {
  if (!drag) return;
  sheet.classList.remove('dragging');
  const hs = snapHeights();
  if (!drag.moved) { const i = SNAPS.indexOf(snap); let n = SNAPS[(i + 1) % 3]; if (hs[n] === hs[snap]) n = SNAPS[(i + 2) % 3]; drag = null; applySnap(n); return; }
  const h = sheet.getBoundingClientRect().height;
  const v = (drag.y - e.clientY) / Math.max(1, performance.now() - drag.t);     // px/ms, up is positive
  let best = snap, bd = Infinity;
  for (const n of SNAPS) { const d = Math.abs(hs[n] - (h + v * 180)); if (d < bd) { bd = d; best = n; } }
  drag = null; applySnap(best);
}
grab.addEventListener('pointerup', endDrag);
grab.addEventListener('pointercancel', endDrag);
grab.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); applySnap(SNAPS[(SNAPS.indexOf(snap) + 1) % 3]); } });
// keyboard: keep the sheet on top of it (iOS shrinks only the visual viewport)
function onViewport() {
  const v = vv();
  const kb = Math.max(0, Math.round(innerHeight - v.height - v.offsetTop));
  document.documentElement.style.setProperty('--kb', (kb > 60 ? kb : 0) + 'px');
  applySnap();
}
if (window.visualViewport) { visualViewport.addEventListener('resize', onViewport); visualViewport.addEventListener('scroll', onViewport); }
// the model is centred in the part of the screen between the top bar and the sheet (camera view offset)
function viewInsets() {
  const H = stage.clientHeight;
  const top = (document.getElementById('topbar').hidden ? 0 : 60) + SAT;
  const kb = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--kb')) || 0;
  if (sideMode()) return { top, bottom: 0, left: sheet.hidden ? 0 : sheet.getBoundingClientRect().right };
  const bottom = sheet.hidden ? 0 : Math.min(sheetTargetH + kb, H * 0.62);
  return { top, bottom, left: 0 };
}
function updateViewOffset() {
  const W = stage.clientWidth, H = stage.clientHeight;
  if (!W || !H) return;
  const { top, bottom, left } = viewInsets();
  const dy = Math.round((bottom - top) / 2), dx = -Math.round(left / 2);
  for (const cam of [persp, ortho]) { cam.setViewOffset(W, H, dx, dy, W, H); cam.updateProjectionMatrix(); }
  invalidate();
}
// reset for the next participant: no places, standard profile, overview
function resetAll() {
  hidePeek(); closeMore();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  nav.step = null; nav.plan = null;
  setPlace('from', null, false); setPlace('to', null, false);
  nav.profile = 'standard'; syncProfile();
  nav.fadeOthers = false; document.getElementById('routeOnly').checked = false;
  state.focus = null; syncStoreyButtons();
  clearSel();
  setView('overview');
  writeHash();
}
// stop Safari zooming the page with two fingers over the panels (the 3D view has its own pinch)
document.addEventListener('gesturestart', (e) => e.preventDefault());
// any touch, click or key keeps the view drawing for a moment
for (const ev of ['pointerdown', 'pointermove', 'wheel', 'keydown', 'click', 'input'])
  document.addEventListener(ev, () => invalidate(400), { capture: true, passive: true });

document.getElementById('legend').innerHTML = `
  <div>${legendIcon.stairs}Stairs</div>
  <div>${legendIcon.escalator}Escalator, arrows run with it</div>
  <div>${legendIcon.lift}Lift (shaft and stops)</div>
  <div>${legendIcon.ramp}Ramp</div>
  ${Object.values(GROUPS).map(g => `<div><span class="sw" style="background:var(${g.token})"></span>Tracks ${g.label}</div>`).join('')}
  <div><span class="sw closed-sw"></span>Closed (SZU until 12.12.2026)</div>
  <div><span class="sw" style="background:var(--wing); border:1.5px solid var(--divider)"></span>Shop wing (Nord-/Südtrakt)</div>
  <div><span class="sw" style="background:var(--hall); border:1.5px solid var(--divider)"></span>Open hall (Querhalle, Haupthalle)</div>
  <div><span class="sw" style="background:var(--route)"></span>Fastest route</div>
  <div><span class="sw" style="background:repeating-linear-gradient(90deg, var(--route-sf) 0 5px, transparent 5px 8px)"></span>Step-free route</div>
  <div><span class="sw" style="background:var(--route-conn)"></span>Stairs, escalator or lift on the route</div>
  <div><span class="sw" style="background:var(--tram)"></span>Tram platform (OSM)</div>
  <div><svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><path d="M2 8H20" stroke="var(--street)" stroke-width="1.5"/></svg>Path (OSM line)</div>`;
document.getElementById('attribution').innerHTML = `Heights ×${VEX}. Data ${esc(D.meta.source_date)}: ${esc(D.meta.attribution)}.`;
document.getElementById('about').innerHTML = `
  <p>Station model and paths from <b>${fmtDay(D.meta.source_date)}</b>. Closures are applied by the date on this phone (today ${fmtDay(TODAY)}).</p>
  <p>Routes are computed on the phone; nothing is sent or stored. Route times are estimates from the model.</p>
  <p><button class="btn small" id="aboutReset">New route (reset)</button></p>`;
document.getElementById('aboutReset').onclick = resetAll;

// theme changes
const reTheme = () => recolor();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', reTheme);
new MutationObserver(reTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ------------------------------------------------------------------ resize & loop
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  persp.aspect = w / h; persp.updateProjectionMatrix();
  if (camera === ortho) { const hw = (ortho.right - ortho.left) / 2, hh = (ortho.top - ortho.bottom) / 2; const asp = w / h; const nhw = Math.max(hw, hh * asp); const nhh = nhw / asp; ortho.left = -nhw; ortho.right = nhw; ortho.top = nhh; ortho.bottom = -nhh; ortho.updateProjectionMatrix(); }
  routeMats.forEach(m => m.resolution.set(w, h));
  updateViewOffset();
  invalidate();
}
window.addEventListener('resize', () => { resize(); applySnap(); });

for (const s of D.storeys) storeyGroups[s.id].position.y = storeyOffset(s.order);
document.getElementById('loading').remove();
document.getElementById('topbar').hidden = false;
sheet.hidden = false;
SAT = cssPx('--sat');
resize();
layoutConnectors();
renderIntro();
setView('overview');
recolor();
if (NAV) { syncProfile(); syncRouteButtons(); readHash(); }
let lastAnim = 0, frameCount = 0;
renderer.setAnimationLoop((t) => {
  lastT = t;
  const flying = stepFlight();
  const moved = controls.update();
  let draw = needsRender || flying || moved || performance.now() < renderUntil;
  const run = animatedEsc();
  if (run && run.size && !reduceMotion && t - lastAnim > 40) { lastAnim = t; animateChevrons(t); draw = true; }   // ~25 fps for the arrows
  if (!draw) return;
  needsRender = false; frameCount++;
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
window.__hb = { state, nav, NAV, routeTest, setPlace, computeRoute, enterStep, exitStep, resetAll, SHOPS, selectShop, selectArea, setView, frames: () => frameCount, D, camera: () => camera, controls: () => controls, project: (i) => { const v = nodeWorld(i).project(camera); return [(v.x + 1) / 2 * stage.clientWidth, (1 - v.y) / 2 * stage.clientHeight]; } };   // for debugging in the console
</script>
